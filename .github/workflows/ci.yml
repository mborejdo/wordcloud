name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain (with rustfmt and clippy) comes from rust-toolchain.toml; rustup
      # installs it on the first cargo call.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: |
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - name: test
        run: |
          cargo test --all-features --locked
          cargo test --no-default-features --locked
      - name: doc
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: deny
        run: cargo deny check
      - name: Render the example
        run: cargo run --release --locked -- examples/cloud.toml --out out/cloud.svg --png 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-cloud
          path: out/

  action:
    # The composite action end to end (prebuilt binary, or a source build before the first release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          wordlist: examples/cloud.toml
          out: out/action/cloud.svg
          png: "1"
      - run: test -s out/action/cloud.svg && test -s out/action/cloud-dark.svg && test -s out/action/cloud.png
