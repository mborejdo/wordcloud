[package]
name = "wordcloud"
version = "3.1.0"
edition = "2024"
# The highest floor any dependency declares (filmstrip). The MSRV-aware resolver holds a
# dependency back below its own floor, so keep this at or above it.
rust-version = "1.92"
authors = ["Michael Borejdo <mborejdo@gmail.com>"]
description = "Word clouds packed by glyph outlines on an Archimedean spiral, as transparent SVG and PNG, or built up as GIF and MP4."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mborejdo/wordcloud"
homepage = "https://github.com/mborejdo/wordcloud"
# Installed from git (cargo install --git) or as a release binary, never from crates.io.
publish = false
readme = "README.md"
keywords = ["wordcloud", "svg", "typography", "visualization", "animation"]
categories = ["visualization", "command-line-utilities"]
include = ["src/**", "fonts/**", "README.md", "CHANGELOG.md", "LICENSE-*", "Cargo.toml"]

[features]
default = ["cli", "http", "animate"]
# The `wordcloud` binary (it needs `http` too).
cli = ["dep:clap", "animate"]
# GitHub activity boost and the embeddings backend over HTTP.
http = ["dep:ureq"]
# The built-up cloud as an animated GIF and an MP4.
animate = ["dep:filmstrip"]

[[bin]]
name = "wordcloud"
path = "src/main.rs"
# The binary calls the GitHub and embeddings clients, so it needs `http` as well.
required-features = ["cli", "http"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
# Shaping; re-exports ttf-parser for the glyph outlines.
rustybuzz = "0.20"
# Coverage rasterisation and PNG.
tiny-skia = "0.12"
# Mask images.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
# The GIF and MP4 writers, from flipcard.
filmstrip = { git = "https://github.com/mborejdo/flipcard", tag = "v0.3.0", default-features = false, features = ["gif", "mp4"], optional = true }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Unavoidable with many transitive deps.
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# No required `# Errors` / `# Panics` sections, no doc-paragraph length limit.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# Contradicts rustc `unreachable_pub`, which is kept.
redundant_pub_crate = "allow"
# Stricter than the groups: no panicking shortcuts or stray output in library code (tests are
# exempt, see clippy.toml), and every `#[allow]` says why.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[lints.rustdoc]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
